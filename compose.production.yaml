services:
  app:
    build: .
    image: inventory-app:${APP_IMAGE_TAG:-latest}
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks: [inventory-network]

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports: ["${APP_PORT:-8088}:80"]
    depends_on: [app]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [inventory-network]

  queue:
    image: inventory-app:${APP_IMAGE_TAG:-latest}
    command: php artisan queue:work --tries=3 --backoff=30 --timeout=120
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks: [inventory-network]

  scheduler:
    image: inventory-app:${APP_IMAGE_TAG:-latest}
    command: php artisan schedule:work
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks: [inventory-network]

  reporting:
    build: ./go-reporting
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      REPORTING_PORT: 8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [inventory-network]

  mysql:
    image: mysql:8.4
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    volumes: [mysql-production-data:/var/lib/mysql]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [inventory-network]

volumes:
  mysql-production-data:

networks:
  inventory-network:
